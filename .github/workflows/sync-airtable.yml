name: Sync Airtable Data

on:
  # Run daily at 7am ET (12:00 UTC)
  schedule:
    - cron: '0 12 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger sync on Nestify server
        run: |
          echo "Triggering Airtable sync..."
          response=$(curl -s -w "\n%{http_code}" "${{ secrets.SYNC_URL }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response:"
          echo "$body"
          echo ""
          echo "HTTP Status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "Sync failed with status $http_code"
            exit 1
          fi

          echo "Sync completed successfully!"
